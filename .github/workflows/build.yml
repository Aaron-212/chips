name: Build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        env:
            ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      target: aarch64-macos
                    - runner: ubuntu-latest
                      target: x86_64-linux
        steps:
            - name: Check out repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Zig
              uses: jdx/mise-action@v5.2.5
              with:
                  install_args: zig

            - name: Cache Zig build and dependencies
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      .zig-cache
                      zig-pkg
                      ${{ env.ZIG_GLOBAL_CACHE_DIR }}
                  key: zig-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('mise.toml', 'build.zig.zon') }}-${{ github.sha }}
                  restore-keys: |
                      zig-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('mise.toml', 'build.zig.zon') }}-

            - name: Compile
              run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

            - name: Upload binary
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: chips-${{ matrix.target }}
                  path: zig-out/bin/chips
                  if-no-files-found: error
