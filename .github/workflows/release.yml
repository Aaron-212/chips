name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ github.ref_name }}
    GH_REPO: ${{ github.repository }}

defaults:
    run:
        shell: bash

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
            attestations: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      target: aarch64-macos
                      zig_target: ""
                    - runner: ubuntu-latest
                      target: x86_64-linux-musl
                      zig_target: x86_64-linux-musl
        env:
            TARGET: ${{ matrix.target }}
            ZIG_TARGET: ${{ matrix.zig_target }}
        steps:
            - name: Validate version tag
              run: |
                  [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

            - name: Check out repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Zig
              uses: jdx/mise-action@v5.2.5
              with:
                  install_args: zig
                  cache: false

            - name: Compile
              run: |
                  args=(-Doptimize=ReleaseFast -Dcpu=baseline)
                  if [[ -n "$ZIG_TARGET" ]]; then
                      args+=("-Dtarget=$ZIG_TARGET")
                  fi
                  zig build "${args[@]}"

            - name: Package binary
              run: |
                  mkdir -p dist
                  tar -czf "dist/chips-${TARGET}.tar.gz" -C zig-out/bin chips

            - name: Attest binary and archive
              id: attest
              uses: actions/attest@v4.2.2
              with:
                  subject-path: |
                      zig-out/bin/chips
                      dist/chips-${{ matrix.target }}.tar.gz

            - name: Save attestation URL
              env:
                  ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
              run: |
                  printf -- '- [chips-%s.tar.gz attestation](%s)\n' "$TARGET" "$ATTESTATION_URL" \
                      > "dist/chips-${TARGET}.md"

            - name: Transfer package and attestation URL
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: release-${{ matrix.target }}
                  path: |
                      dist/*.tar.gz
                      dist/*.md
                  if-no-files-found: error

    draft:
        name: Draft release
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Gather packages and attestation URLs
              uses: actions/download-artifact@v8.0.2
              with:
                  pattern: release-*
                  merge-multiple: true
                  path: dist

            - name: Create draft release
              run: |
                  if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
                      if [[ "$draft" != true ]]; then
                          echo "Release is already published: $RELEASE_TAG" >&2
                          exit 1
                      fi
                  else
                      args=(--verify-tag --draft --generate-notes)
                      if [[ "$RELEASE_TAG" == *-* ]]; then
                          args+=(--prerelease)
                      fi
                      gh release create "$RELEASE_TAG" "${args[@]}"
                  fi
                  notes_file="$RUNNER_TEMP/chips-release-notes.md"
                  gh release view "$RELEASE_TAG" --json body --jq '.body // ""' |
                      awk '!/^- \[chips-.*\.tar\.gz attestation\]\(/' > "$notes_file"
                  printf '\n' >> "$notes_file"
                  cat dist/*.md >> "$notes_file"
                  gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
                  gh release upload "$RELEASE_TAG" --clobber dist/*.tar.gz
